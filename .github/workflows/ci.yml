name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo Format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Test
        run: cargo test --all-targets
      - name: Noise Simulation Test
        run: cargo run --bin simulate -- --ber 0.0001 --encodings "gzip,h,rs(255,223)" --limit 10

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Set Default Toolchain
        run: rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run Fuzz Targets
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_unpack -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_kiss_decoder -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_deframer -- -max_total_time=30
          cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_codecs -- -max_total_time=30

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.patch
          else
            git diff HEAD~1...HEAD > /tmp/diff.patch || true
          fi

          if [ -s /tmp/diff.patch ]; then
            echo "Running cargo mutants on touched lines in diff:"
            cat /tmp/diff.patch | head -n 30
            cargo mutants --in-place -D /tmp/diff.patch -v
          else
            echo "No diff found or full push; testing core kiss & generator modules:"
            cargo mutants --in-place --file src/kiss.rs --file src/generator.rs -v
          fi
      - name: Upload Mutants Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
