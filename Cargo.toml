[package]
name = "hqfbp-rs"
version = "0.1.0"
edition = "2024"
authors = ["Loïc Fejoz <loic@fejoz.net>"]
description = "Rust implementation of the Hamradio Quick File Broadcasting Protocol (HQFBP)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/loic-fejoz/hqfbp-rs"
keywords = ["hamradio", "broadcast", "fec", "cbor", "kiss"]

[dependencies]
minicbor = { version = "2.3", features = ["derive", "alloc"] }
serde_json = "1.0"
reed-solomon = "0.2"
raptorq = "2.0"
flate2 = "1.0"
brotli = "9.1"
lzma-rs = "0.3"
crc = "3.2"
regex = "1.11"
anyhow = "1.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10"
csv = "1.3"
mime_guess = "2.0"
time = "0.3"
bytes = "1.9"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "regex"] }

[dev-dependencies]
proptest = "1.6"
criterion = "0.8"

[[bench]]
name = "bench_hqfbp"
harness = false

[profile.release]
codegen-units = 1
debug = true       # Keep debug symbols for profiling with perf/flamegraph
strip = false
lto = true
